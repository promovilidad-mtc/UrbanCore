<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanCore Visor — PROMOVILIDAD / MTC</title>
<!-- Librerías locales (carpeta ../vendor/) para trabajar sin internet; si no están, se usan las del CDN -->
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'" />
<link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'" />
<link rel="stylesheet" href="estilos.css" />
<script>
/* Tema visual: por defecto el piloto "Google" (tema-google.css). Para ver el diseño anterior: index.html?tema=glass
   Modo oscuro: solo con el tema Google. Botón luna/sol en la barra; se recuerda en el navegador (o index.html?tema=oscuro). */
(function(){
  var q = new URLSearchParams(location.search).get('tema');
  if(q === 'glass') return;
  var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'tema-google.css';
  document.head.appendChild(l);
  var osc = (q === 'oscuro');
  try{ if(!q && localStorage.getItem('urbancore-tema') === 'oscuro') osc = true; }catch(e){}
  if(osc) document.documentElement.setAttribute('data-tema', 'oscuro');
})();
</script>
</head>
<body>

<header id="app-header">
  <div class="header-left">
    <div class="breadcrumb"><a class="btn-atras" href="../index.html" title="Volver al inicio de UrbanCore"><i class="fa-solid fa-arrow-left"></i> Atrás</a></div>
    <div class="header-divider"></div>
    <div class="logo">UrbanCore <span>Visor</span></div>
    <div class="header-divider"></div>
    <nav id="modulos-nav"></nav>
  </div>
  <div class="header-right">
    <span class="status-pill" id="status-pill">Sin red vial</span>
    <input type="file" id="file-red" accept=".zip,.geojson,.json,.kml,.kmz" style="display:none">
    <button class="btn primary" id="btn-load-red" title="Cargar red vial (shapefile .zip, GeoJSON, KML, KMZ)"><i class="fa-solid fa-map"></i> Red vial</button>
    <button class="btn" id="btn-osm" title="Descargar la red vial de OpenStreetMap (requiere internet)"><i class="fa-solid fa-cloud-arrow-down"></i> OSM</button>
    <input type="file" id="file-open" accept=".json" style="display:none">
    <button class="btn" id="btn-open" title="Abrir proyecto de UrbanCore o sesión de RutaCore / ClasificadorVial"><i class="fa-solid fa-folder-open"></i> Abrir</button>
    <button class="btn" id="btn-ruler" disabled title="Regla de medición"><i class="fa-solid fa-ruler"></i> Regla</button>
    <button class="btn" id="btn-sv" disabled title="Street View: clic en el mapa para ver la zona en Google Maps"><i class="fa-solid fa-street-view"></i> Street View</button>
    <div class="export-wrap">
      <button class="btn" id="btn-export" disabled>Exportar ▾</button>
      <div class="export-menu" id="export-menu"></div>
    </div>
    <button class="btn" id="btn-tema" style="display:none" title="Cambiar a modo oscuro"><i class="fa-solid fa-moon"></i></button>
  </div>
</header>

<div id="instruction"><div class="dot"></div><span id="instruction-text">Carga una red vial o abre un proyecto para comenzar</span></div>

<!-- Panel izquierdo: aquí cada módulo pone su panel -->
<aside id="panel"></aside>
<!-- Panel derecho: resultados del módulo activo -->
<div id="results"></div>

<div id="map"></div>

<!-- Barra de información del módulo Rutas -->
<div id="info-bar" class="oculto">
  <div id="trace-mode-badge"><div class="pulse"></div><span id="trace-badge-text">Trazando</span></div>
  <div class="info-chip">Ruta: <strong id="info-ruta">—</strong></div>
  <div class="info-sep"></div>
  <div class="info-chip">Variante: <strong id="info-variante">—</strong></div>
  <div class="info-sep"></div>
  <div class="info-chip">Km: <strong id="info-km">0.00 km</strong></div>
  <div class="info-sep"></div>
  <div class="info-chip">Segs: <strong id="info-segs">0</strong></div>
</div>

<!-- Regla -->
<div id="ruler-overlay"></div>
<div id="ruler-banner">
  <div class="ruler-pulse"></div>
  <span><i class="fa-solid fa-ruler"></i> Regla activa — clic para medir puntos</span>
  <button id="ruler-clear-btn">Limpiar</button>
  <span style="opacity:.6;font-size:12px">· Apaga la regla para seguir trabajando</span>
</div>
<div id="ruler-total-display"><i class="fa-solid fa-ruler"></i> Total: <strong id="ruler-dist">0 m</strong></div>

<div id="loader"><div class="loader-card"><div class="spinner"></div><span id="loader-text">Procesando…</span></div></div>

<!-- Fondos y capas -->
<div id="basemap-ctrl">
  <button id="bm-claro" class="active">Claro</button>
  <button id="bm-oscuro">Oscuro</button>
  <button id="bm-satelite">Satélite</button>
  <button id="bm-osm">OSM</button>
</div>
<button class="btn" id="capas-btn" title="Capas visibles"><i class="fa-solid fa-layer-group"></i> Capas</button>
<div id="capas-panel"></div>

<!-- Modal de reportes -->
<div id="report-bg">
  <div id="report-box">
    <div id="report-hd"><h2 id="report-title">Reporte</h2><button id="report-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="report-bd"></div>
    <div id="report-actions"></div>
  </div>
</div>

<!-- Librerías: primero la copia local (../vendor/, funciona sin internet); si falta, la del CDN (mismas versiones) -->
<script src="../vendor/leaflet/leaflet.js"></script>
<script>window.L||document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script src="../vendor/proj4/proj4.js"></script>
<script>window.proj4||document.write('<script src="https://unpkg.com/proj4@2.10.0/dist/proj4.js"><\/script>');</script>
<script src="../vendor/shpjs/shp.min.js"></script>
<script>window.shp||document.write('<script src="https://unpkg.com/shpjs@6.2.0/dist/shp.min.js"><\/script>');</script>
<script src="../vendor/jszip/jszip.min.js"></script>
<script>window.JSZip||document.write('<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"><\/script>');</script>
<script src="../vendor/togeojson/togeojson.js"></script>
<script>window.toGeoJSON||document.write('<script src="https://unpkg.com/togeojson@0.16.0/togeojson.js"><\/script>');</script>
<script src="../vendor/xlsx/xlsx.full.min.js"></script>
<script>window.XLSX||document.write('<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"><\/script>');</script>

<!-- Núcleo -->
<script src="nucleo/utilidades.js"></script>
<script src="nucleo/mapa.js"></script>
<script src="nucleo/red.js"></script>
<script src="nucleo/interaccion.js"></script>
<script src="nucleo/modulos.js"></script>
<script src="nucleo/proyecto.js"></script>
<script src="nucleo/regla.js"></script>
<script src="nucleo/streetview.js"></script>

<!-- Módulos: para agregar uno nuevo, crear su archivo en modulos/ y sumarlo aquí -->
<script src="modulos/rutas.js"></script>
<script src="modulos/red.js"></script>
<script src="modulos/jerarquia.js"></script>
<script src="modulos/analisis.js"></script>
<script src="modulos/cobertura.js"></script>
<script src="modulos/paraderos.js"></script>
<script src="modulos/atributos.js"></script>

<script src="nucleo/arranque.js"></script>
<script src="nucleo/autoguardado.js"></script>
<script src="nucleo/bienvenida.js"></script>
<script src="nucleo/osm.js"></script>

<script>
/* Modo oscuro (solo con el tema Google): no toca ninguna función del visor, solo un atributo del <html> */
(function(){
  var btn = document.getElementById('btn-tema');
  var q = new URLSearchParams(location.search).get('tema');
  if(!btn || q === 'glass') return;
  var KEY = 'urbancore-tema';
  function activo(id){ var b = document.getElementById(id); return !!(b && b.classList.contains('active')); }
  function clic(id){ var b = document.getElementById(id); if(b) b.click(); }
  function aplicar(osc, cambiarMapa){
    document.documentElement.setAttribute('data-tema', osc ? 'oscuro' : 'claro');
    btn.innerHTML = '<i class="fa-solid ' + (osc ? 'fa-sun' : 'fa-moon') + '"></i>';
    btn.title = osc ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    /* el fondo de mapa acompaña solo si estaba en Claro/Oscuro; Satélite y OSM no se tocan */
    if(cambiarMapa){ if(osc && activo('bm-claro')) clic('bm-oscuro'); else if(!osc && activo('bm-oscuro')) clic('bm-claro'); }
  }
  btn.addEventListener('click', function(){
    var osc = document.documentElement.getAttribute('data-tema') !== 'oscuro';
    aplicar(osc, true);
    try{ localStorage.setItem(KEY, osc ? 'oscuro' : 'claro'); }catch(e){}
  });
  aplicar(document.documentElement.getAttribute('data-tema') === 'oscuro', true);
})();
</script>
</body>
</html>
